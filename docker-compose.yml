services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: eventplatform-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: eventplatform-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:18
    container_name: eventplatform-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:18
    container_name: eventplatform-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:18
    container_name: eventplatform-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────── Независимые сервисы со своей зоной ответственности ───────────────────────────
  users:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: EventPlatform.Users
    command: ["EventPlatform.Users.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres
      MessageBroker__BootstrapServers: kafka:29092
      JWT__Issuer: "EventPlatform.AuthServer"
      JWT__Audience: "EventPlatform.Api"
      JWT__Key: "long-hair-horse-eats-apples-under-the-tree"
    ports:
      - "5001:8080"
    depends_on:
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  events:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: EventPlatform.Events
    command: ["EventPlatform.Events.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres
      MessageBroker__BootstrapServers: kafka:29092
      JWT__Issuer: "EventPlatform.AuthServer"
      JWT__Audience: "EventPlatform.Api"
      JWT__Key: "long-hair-horse-eats-apples-under-the-tree"
    ports:
      - "5002:8080"
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookings:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: EventPlatform.Bookings
    command: ["EventPlatform.Bookings.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
      MessageBroker__BootstrapServers: kafka:29092
      JWT__Issuer: "EventPlatform.AuthServer"
      JWT__Audience: "EventPlatform.Api"
      JWT__Key: "long-hair-horse-eats-apples-under-the-tree"
    ports:
      - "5003:8080"
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
