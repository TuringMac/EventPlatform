global:
  scrape_interval: 15s  # Как часто опрашивать цели

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["events:8080"]  # Адрес .NET-сервиса

  - job_name: bookings-service
    static_configs:
      - targets: ["bookings:8080"]

  - job_name: users-service
    static_configs:
      - targets: ["users:8080"]